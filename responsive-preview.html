<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蘆光守夜 · 響應式預覽</title><style>body{margin:0;background:#0b211c;color:#ddebcd;font:14px system-ui}nav{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px}button,a{font:inherit;color:inherit;border:1px solid #607660;background:#204135;padding:8px 13px;border-radius:8px}iframe{display:block;margin:0 auto 16px;border:2px solid #456349;border-radius:12px;width:390px;height:700px;max-width:calc(100vw - 12px)}p{text-align:center;font-size:12px;color:#a2b9a4}</style></head><body><nav><button id="phone">390px 直向</button><button id="wide">844px 橫向</button><a href="./">直接遊玩</a></nav><iframe id="preview" title="可操作的蘆光守夜遊戲預覽" src="./"></iframe><p>這是實際窄視窗中的公開遊戲，用於響應式檢查。觸控裝置體驗仍以實機為準。</p><script>const f=document.getElementById('preview');document.getElementById('phone').onclick=()=>{f.style.width='390px';f.style.height='700px'};document.getElementById('wide').onclick=()=>{f.style.width='844px';f.style.height='390px'};</script></body></html>
